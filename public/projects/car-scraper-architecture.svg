<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" role="img" aria-label="Architecture diagram: GitHub Actions cron drives five scraper engines over 36 dealer sites into SQLite, feeding deal scoring, Discord alerts, and a local dashboard" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232831"/>
      <stop offset="1" stop-color="#15181e"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#55627a"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7aa2ff"/>
    </marker>
  </defs>
  <rect width="1600" height="960" fill="url(#bg)"/>

  <!-- cron -->
  <rect x="500" y="42" width="330" height="84" rx="14" fill="#1b202a" stroke="#7aa2ff" stroke-width="2.5"/>
  <text x="665" y="78" text-anchor="middle" fill="#e8ebf0" font-size="26" font-weight="700">GitHub Actions</text>
  <text x="665" y="108" text-anchor="middle" fill="#aab2bf" font-size="20">cron · scrape every 6 hours</text>

  <!-- data branch -->
  <rect x="1180" y="42" width="350" height="84" rx="14" fill="#1b202a" stroke="#3a4353" stroke-width="2.5" stroke-dasharray="7 6"/>
  <text x="1355" y="78" text-anchor="middle" fill="#e8ebf0" font-size="26" font-weight="700">orphan “data” branch</text>
  <text x="1355" y="108" text-anchor="middle" fill="#aab2bf" font-size="20">cars.db snapshot, force-pushed</text>
  <path d="M830 84 L1180 84" stroke="#55627a" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arr)"/>
  <text x="1005" y="72" text-anchor="middle" fill="#8a93a3" font-size="18">persist DB</text>

  <!-- sources -->
  <text x="80" y="188" fill="#8a93a3" font-size="20" font-weight="600" letter-spacing="2">36 CT DEALER SITES</text>
  <g fill="#1b202a" stroke="#2a313c" stroke-width="2">
    <rect x="80" y="208" width="280" height="60" rx="12"/>
    <rect x="80" y="288" width="280" height="60" rx="12"/>
    <rect x="80" y="368" width="280" height="60" rx="12"/>
    <rect x="80" y="448" width="280" height="60" rx="12"/>
    <rect x="80" y="528" width="280" height="60" rx="12" stroke-dasharray="7 6"/>
  </g>
  <g fill="#e8ebf0" font-size="22" text-anchor="middle">
    <text x="220" y="245">dealer.com</text>
    <text x="220" y="325">DealerInspire</text>
    <text x="220" y="405">DealerOn</text>
    <text x="220" y="480">DealerCarSearch</text>
    <text x="220" y="561">CarGurus</text>
  </g>
  <g fill="#8a93a3" font-size="16" text-anchor="middle">
    <text x="220" y="500">~35 independents</text>
    <text x="220" y="581">manual only</text>
  </g>

  <!-- engines -->
  <rect x="480" y="330" width="300" height="112" rx="14" fill="#1b202a" stroke="#2a313c" stroke-width="2.5"/>
  <text x="630" y="376" text-anchor="middle" fill="#e8ebf0" font-size="26" font-weight="700">5 scraper engines</text>
  <text x="630" y="406" text-anchor="middle" fill="#aab2bf" font-size="20">Playwright intercept · requests</text>
  <g stroke="#55627a" stroke-width="3" fill="none">
    <path d="M360 238 C430 238 430 358 480 362" marker-end="url(#arr)"/>
    <path d="M360 318 C425 318 430 372 480 376" marker-end="url(#arr)"/>
    <path d="M360 398 L480 390" marker-end="url(#arr)"/>
    <path d="M360 478 C425 478 430 410 480 404" marker-end="url(#arr)"/>
    <path d="M360 558 C435 558 430 424 480 418" stroke-dasharray="7 6" marker-end="url(#arr)"/>
  </g>
  <path d="M665 126 L640 330" stroke="#7aa2ff" stroke-width="3" fill="none" marker-end="url(#arrb)"/>

  <!-- ingest -->
  <rect x="860" y="330" width="290" height="112" rx="14" fill="#1b202a" stroke="#2a313c" stroke-width="2.5"/>
  <text x="1005" y="376" text-anchor="middle" fill="#e8ebf0" font-size="26" font-weight="700">Ingest</text>
  <text x="1005" y="406" text-anchor="middle" fill="#aab2bf" font-size="20">VIN dedup · change tracking</text>
  <path d="M780 386 L860 386" stroke="#55627a" stroke-width="3" marker-end="url(#arr)"/>

  <!-- SQLite cylinder -->
  <g stroke="#7aa2ff" stroke-width="2.5" fill="#1b202a">
    <path d="M1230 348 v96 a150 26 0 0 0 300 0 v-96"/>
    <ellipse cx="1380" cy="348" rx="150" ry="26"/>
  </g>
  <text x="1380" y="400" text-anchor="middle" fill="#e8ebf0" font-size="26" font-weight="700">SQLite</text>
  <text x="1380" y="430" text-anchor="middle" fill="#aab2bf" font-size="19">listings · price history · alert ledger</text>
  <path d="M1150 386 L1228 386" stroke="#55627a" stroke-width="3" marker-end="url(#arr)"/>
  <path d="M1355 126 L1378 318" stroke="#55627a" stroke-width="3" stroke-dasharray="7 6" fill="none" marker-end="url(#arr)"/>

  <!-- deal score -->
  <rect x="1230" y="580" width="300" height="100" rx="14" fill="#1b202a" stroke="#2a313c" stroke-width="2.5"/>
  <text x="1380" y="622" text-anchor="middle" fill="#e8ebf0" font-size="26" font-weight="700">Deal Score</text>
  <text x="1380" y="652" text-anchor="middle" fill="#aab2bf" font-size="20">median of ≥3 comparables</text>
  <path d="M1380 496 L1380 580" stroke="#55627a" stroke-width="3" marker-end="url(#arr)"/>

  <!-- alerts -->
  <rect x="860" y="580" width="290" height="100" rx="14" fill="#1b202a" stroke="#2a313c" stroke-width="2.5"/>
  <text x="1005" y="622" text-anchor="middle" fill="#e8ebf0" font-size="26" font-weight="700">Alerts</text>
  <text x="1005" y="652" text-anchor="middle" fill="#aab2bf" font-size="20">new match · ≥$500 drop · ⚠ notes</text>
  <path d="M1230 630 L1150 630" stroke="#55627a" stroke-width="3" marker-end="url(#arr)"/>

  <!-- discord -->
  <rect x="480" y="580" width="300" height="100" rx="14" fill="#1b202a" stroke="#7aa2ff" stroke-width="2.5"/>
  <text x="630" y="622" text-anchor="middle" fill="#e8ebf0" font-size="26" font-weight="700">Discord</text>
  <text x="630" y="652" text-anchor="middle" fill="#aab2bf" font-size="20">webhook embeds · #bot-config</text>
  <path d="M860 630 L780 630" stroke="#55627a" stroke-width="3" marker-end="url(#arr)"/>
  <path d="M600 580 L618 442" stroke="#55627a" stroke-width="3" stroke-dasharray="7 6" fill="none" marker-end="url(#arr)"/>
  <text x="500" y="516" fill="#8a93a3" font-size="18">typed config</text>
  <text x="500" y="540" fill="#8a93a3" font-size="18">commands ↑</text>

  <!-- dashboard -->
  <rect x="1230" y="760" width="300" height="100" rx="14" fill="#1b202a" stroke="#2a313c" stroke-width="2.5"/>
  <text x="1380" y="802" text-anchor="middle" fill="#e8ebf0" font-size="26" font-weight="700">Dashboard &amp; CLI</text>
  <text x="1380" y="832" text-anchor="middle" fill="#aab2bf" font-size="20">FastAPI + HTMX · Typer</text>
  <path d="M1540 420 C1575 430 1575 800 1532 808" stroke="#55627a" stroke-width="3" fill="none" marker-end="url(#arr)"/>

  <!-- footnote -->
  <text x="80" y="906" fill="#8a93a3" font-size="19">One Python process, one SQLite file – no services, no queues, no paid APIs.</text>
</svg>
