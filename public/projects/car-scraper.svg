<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" role="img" aria-label="Illustration of a magnifying glass finding a car listing">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232831"/>
      <stop offset="1" stop-color="#15181e"/>
    </linearGradient>
  </defs>

  <!-- background (matches the card placeholder gradient) -->
  <rect width="1000" height="1250" fill="url(#bg)"/>

  <!-- listing rows (top-left): the "feed" being scanned -->
  <g>
    <circle cx="110" cy="122" r="9" fill="#7aa2ff"/>
    <rect x="140" y="111" width="260" height="22" rx="11" fill="#55627a"/>
    <circle cx="110" cy="182" r="9" fill="#3a4353"/>
    <rect x="140" y="171" width="180" height="22" rx="11" fill="#3a4353"/>
    <circle cx="110" cy="242" r="9" fill="#3a4353"/>
    <rect x="140" y="231" width="220" height="22" rx="11" fill="#3a4353"/>
  </g>

  <!-- magnifying glass locking onto the listing -->
  <g>
    <circle cx="660" cy="470" r="170" fill="rgb(147 197 253 / 0.07)"
            stroke="#ddd6fe" stroke-width="16"/>
    <line x1="781" y1="591" x2="892" y2="702" stroke="#ddd6fe"
          stroke-width="28" stroke-linecap="round"/>
    <!-- the find: a price chip in the lens -->
    <rect x="560" y="435" width="200" height="72" rx="36"
          fill="rgb(122 162 255 / 0.16)" stroke="#7aa2ff" stroke-width="5"/>
    <text x="660" y="486" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif"
          font-size="44" font-weight="700" fill="#dbe7ff">$8,450</text>
  </g>

  <!-- car (line-art, site blue) -->
  <g stroke="#7aa2ff" stroke-width="13" fill="none" stroke-linecap="round">
    <path d="M290 780 C335 665, 585 665, 640 780"/>
    <rect x="150" y="780" width="620" height="112" rx="52"/>
    <line x1="465" y1="788" x2="465" y2="884" stroke-width="7" opacity="0.5"/>
    <circle cx="330" cy="892" r="56" fill="#161b22"/>
    <circle cx="590" cy="892" r="56" fill="#161b22"/>
    <circle cx="330" cy="892" r="9" fill="#7aa2ff" stroke="none"/>
    <circle cx="590" cy="892" r="9" fill="#7aa2ff" stroke="none"/>
    <circle cx="750" cy="816" r="9" fill="#93c5fd" stroke="none"/>
  </g>

  <!-- dashed road -->
  <line x1="130" y1="1010" x2="870" y2="1010" stroke="#2a313c" stroke-width="7"
        stroke-linecap="round" stroke-dasharray="4 48"/>
</svg>
